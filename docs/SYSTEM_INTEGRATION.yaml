version: 1
flows:
- id: FLOW_REFERENCE_TO_PRODUCT
  trace:
  - CR_REFERENCE:authorized target/source
  - CR_REFERENCE:survey/inventory + extraction/static recovery as material
  - CR_REFERENCE:targeted runtime corroboration for material runtime-sensitive claims when practical
  - CR_REFERENCE:controlled adversarial/limit probing when hidden contracts or failure
    semantics are material
  - CR_REFERENCE:qualified Evidence + version-aware external research/corroboration when material
  - CR_REFERENCE:Findings + Paths + Reference Model + compact replica trait candidates
  - external:APC durable project compilation when selected OR CR_PRODUCT standalone
    target decision
  - CR_PRODUCT:adopt/adapt/reject/inspiration decision when CoreReplica standalone
    fallback owns the decision
  - CR_PRODUCT:target requirement or existing canonical Product Truth update
  forbidden:
  - reference evidence directly becoming implementation scope without a product decision
  - runtime-sensitive static inference being presented as runtime-verified or complete without a representative real-boundary attempt when practical
  - CoreReplica recreating APC System/Plan/Acceptance authorities when APC is selected
  - APC inventing unresolved reference behavior instead of routing the evidence gap
    back to CoreReplica
  - adversarial probing findings being promoted directly into target requirements
    without Product Truth decision
- id: FLOW_PRODUCT_TO_IMPLEMENTATION
  trace:
  - CR_PRODUCT:target requirement
  - external:Core-First owner/change resolution when material
  - CR_BUILD:canonical implementation path
  - CR_BUILD:implementation progress
  forbidden:
  - CR_BUILD modifying product scope to make implementation easier
  - clone-specific parallel owner bypassing canonical project/workspace owner
- id: FLOW_IMPLEMENTATION_TO_VERIFICATION
  trace:
  - CR_BUILD:current implementation revision
  - CR_VERIFY:test/observable procedure
  - CR_VERIFY:evidence record
  - CR_VERIFY:requirement verification status
  forbidden:
  - implementation status counted as verification evidence
  - verifier fixing source before independently recording the finding
- id: FLOW_FAILURE_TO_CORRECTION
  trace:
  - CR_VERIFY:observable failure
  - existing project routing/runtime trace
  - external:Core-First reverse trace when ownership is material
  - CR_BUILD:canonical owner implementation anchor
  - CR_BUILD:correction
  - CR_VERIFY:fresh re-exercise
- id: FLOW_BRAND_TO_DESIGN
  trace:
  - CR_MARKET:brand profile
  - CR_DESIGN:semantic design contract
  - CR_BUILD:effective presentation
  forbidden:
  - CR_MARKET directly owning design-system component/state rules
- id: FLOW_VERIFICATION_TO_RELEASE
  trace:
  - CR_VERIFY:current acceptance/parity evidence
  - CR_RELEASE:release preflight
  - CR_RELEASE:reversible preparation
  - user_or_project:explicit approval
  - CR_RELEASE:gated consequential transition
