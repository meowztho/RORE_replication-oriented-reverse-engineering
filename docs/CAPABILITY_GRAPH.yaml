version: 1
capabilities:
- id: CAP_ROUTE_ANALYSIS
  owner: RORE_ORCHESTRATION
  contract: Route by target/surface plus knowledge gap plus evidence boundary plus available capability, not by a hard-coded tool or fixed stage chain.
- id: CAP_RECONSTRUCT_REFERENCE
  owner: RORE_RECONSTRUCTION
  contract: Recover and connect behavior, structure, state, data, flows, protocols, assets, mechanics, timing, failure and environment semantics of the reference.
- id: CAP_QUALIFY_EVIDENCE
  owner: RORE_RECONSTRUCTION
  contract: Keep claim strength within the proven evidence boundary; preserve raw, normalized and derived views distinctly.
- id: CAP_CAUSAL_PROBING
  owner: RORE_RECONSTRUCTION
  contract: Use controlled reversible perturbation when it has higher information value than passive observation; stop at sufficient mechanism understanding.
- id: CAP_CROSS_VERSION_RECONSTRUCTION
  owner: RORE_RECONSTRUCTION
  contract: Re-resolve semantic anchors across versions rather than transplanting addresses/offsets or stale inferred structure.
- id: CAP_EVIDENCE_GRAPH_REVIEW
  owner: RORE_EVIDENCE_REVIEW
  contract: Audit Evidence→Finding→Path traceability, fixity, contradictions, coverage and promotion strength without changing the analyzed target or repairing findings in the same pass.
