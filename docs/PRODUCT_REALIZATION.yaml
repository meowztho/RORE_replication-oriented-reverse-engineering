version: 1
master_outcomes:
  - id: OUT_REFERENCE_SEPARATION
    outcome: Reference observations remain sourced, bounded, uncertain where necessary, and separate from target product decisions.
    owner: CR_REFERENCE
  - id: OUT_INDEPENDENT_PRODUCT
    outcome: A target product can explicitly adopt, adapt, reject or use reference traits only as inspiration.
    owner: CR_PRODUCT
  - id: OUT_CANONICAL_IMPLEMENTATION
    outcome: Implementation follows target repository canonical owners/contracts instead of a clone-specific parallel architecture.
    owner: CR_BUILD
  - id: OUT_EVIDENCE_COMPLETION
    outcome: Completion/parity claims are derived from verifier-owned evidence at the required boundary.
    owner: CR_VERIFY
  - id: OUT_DISTINCT_MARKET_IDENTITY
    outcome: Market/brand/launch material is sourced, non-fabricated and independently branded.
    owner: CR_MARKET
  - id: OUT_GUARDED_RELEASE
    outcome: Release preparation can complete without crossing a consequential transition before explicit approval.
    owner: CR_RELEASE
