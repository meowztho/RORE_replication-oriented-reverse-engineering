version: 1
criteria:
  - id: A001
    requirement: Plugin contains exactly the intended eight canonical skills and a valid Agent Plugins 1.0 root manifest.
    evidence: scripts/validate_project.py
  - id: A002
    requirement: No skill defines a mandatory full pipeline; orchestration routes by material trigger.
    evidence: tests/test_governance.py
  - id: A003
    requirement: Reference artifacts and product requirements are separate schemas.
    evidence: tests/test_governance.py
  - id: A004
    requirement: Builder progress cannot satisfy parity/completion.
    evidence: tests/test_evidence_parity.py
  - id: A005
    requirement: Verification skill does not own a fix loop and routes corrections back to implementation owners.
    evidence: tests/test_governance.py
  - id: A006
    requirement: Release skill preserves exact approval boundary while allowing reversible preparation.
    evidence: tests/test_governance.py
  - id: A007
    requirement: Retained/adapted deterministic helpers pass regression tests.
    evidence: Python unittest suite
  - id: A008
    requirement: Source provenance and upstream MIT licensing are retained.
    evidence: SOURCE_PROVENANCE.md, LICENSE-UPSTREAM, THIRD_PARTY_NOTICES.md
  - id: A009
    requirement: Plugin archive contains one self-contained `corereplica/` directory and no secrets/dependency directories.
    evidence: packaging inspection
  - id: A010
    requirement: Useful upstream domain procedures remain available JIT without restoring the mandatory upstream pipeline or overlapping completion authority.
    evidence: tests/test_governance.py
