version: 1
stages:
- id: P1_AUTHORITY_AND_ROUTING
  outcome: CoreReplica authority model and JIT router exist without parallel owners.
  status: complete
- id: P2_SKILL_REWRITE
  outcome: Eight bounded skills implement the CoreReplica responsibilities and source/use/distribution
    policy.
  prerequisites:
  - P1_AUTHORITY_AND_ROUTING
  status: complete
- id: P3_TOOL_ADMISSION
  outcome: Useful upstream deterministic tools are retained/adapted under evidence-only
    contracts.
  prerequisites:
  - P1_AUTHORITY_AND_ROUTING
  status: complete
- id: P4_REGRESSION_AND_GOVERNANCE_EVALS
  outcome: Tool regressions and architecture/routing invariants pass.
  prerequisites:
  - P2_SKILL_REWRITE
  - P3_TOOL_ADMISSION
  status: complete
- id: P5_PRIVATE_PLUGIN
  outcome: Agent Plugins 1.0 package validates and is saved as a private CoreReplica
    plugin.
  prerequisites:
  - P4_REGRESSION_AND_GOVERNANCE_EVALS
  exact_gate: account save is authorized by the user's request; public publication
    is not authorized
  status: complete
- id: P6_FIELD_EVAL_ANOTE
  outcome: CoreReplica is exercised on ANotePortable; empirical failures and companion-plugin
    interactions are recorded.
  prerequisites:
  - P5_PRIVATE_PLUGIN
  status: complete
- id: P7_FIELD_EVAL_HARDENING
  outcome: Empirical failures are corrected without adding new overlapping owners.
  prerequisites:
  - P6_FIELD_EVAL_ANOTE
  status: complete
- id: P9_SOURCE_USE_POLICY
  outcome: Normalize source/access/use/retention/VCS/inclusion/redistribution semantics
    across the package and prevent future blanket-prohibition drift.
  prerequisites:
  - P7_FIELD_EVAL_HARDENING
  status: complete
- id: P10_REFERENCE_EVIDENCE_QUALIFICATION
  outcome: Harden Reference Truth with proportional identity, coverage, lineage, parser
    safety, fail-closed resolution, source precedence and independent-failure-mode
    rules.
  prerequisites:
  - P9_SOURCE_USE_POLICY
  status: complete
- id: P11_REFERENCE_REVERSE_ENGINEERING
  outcome: Expand CR_REFERENCE into a progressive reverse-engineering/reference-recovery
    owner and formalize the CoreReplica→APC handoff without creating a second project
    compiler.
  prerequisites:
  - P10_REFERENCE_EVIDENCE_QUALIFICATION
  status: complete
- id: P13_ADVERSARIAL_LIMIT_PROBING
  outcome: Admit domain-neutral adversarial/limit-testing reasoning into CR_REFERENCE
    without importing a pentest/exploit owner or changing the CoreReplica→APC boundary.
  prerequisites:
  - P11_REFERENCE_REVERSE_ENGINEERING
  status: complete
- id: P14_EXTERNAL_RESEARCH_AND_COMPARATIVE_RE
  outcome: Add version-aware external research/corroboration, format-first recursive
    extraction, artifact-bound analysis state, enforcement-site coverage and cross-version
    semantic anchors without creating a second research/compiler owner.
  prerequisites:
  - P13_ADVERSARIAL_LIMIT_PROBING
  status: complete
- id: P15_RUNTIME_CORROBORATION_AND_LINEAGE_RETENTION
  outcome: Add claim-sensitive runtime corroboration, restore explicit reference-trait
    handoff semantics from v0.2, and challenge broad reconstruction coverage so richer
    RE procedures do not compress away earlier reference responsibilities.
  prerequisites:
  - P14_EXTERNAL_RESEARCH_AND_COMPARATIVE_RE
  status: complete
- id: P12_NEXT_FIELD_EVAL
  outcome: Run a reverse-engineering-heavy field evaluation that stresses extraction/static analysis,
    claim-sensitive runtime corroboration, reconstruction coverage and APC handoff boundaries.
  prerequisites:
  - P15_RUNTIME_CORROBORATION_AND_LINEAGE_RETENTION
  status: ready
