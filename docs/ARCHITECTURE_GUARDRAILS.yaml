version: 1
guardrails:
- id: G001
  rule: Reference Truth must not silently become Product Truth.
- id: G002
  rule: Product requirements must not contain builder-owned completion status.
- id: G003
  rule: Implementation progress must not satisfy verification or release gates.
- id: G004
  rule: Verification is read-only with respect to product implementation until findings
    are independently recorded and routed for correction.
- id: G005
  rule: Heuristic visual/layout scores never prove interaction, persistence, data
    integrity, security, or release readiness.
- id: G006
  rule: CoreReplica must reuse current project owners/authorities before introducing
    new architecture.
- id: G007
  rule: External/reference origin grants no authority to bypass target project validation
    or owner contracts.
- id: G008
  rule: No mandatory linear skill chain; route by material trigger and prerequisites.
- id: G009
  rule: Brand profile supplies identity values; it does not become a parallel Design-System
    owner.
- id: G010
  rule: Current external rules/prices/platform limits must be re-verified when material
    rather than treated as timeless skill truth.
- id: G011
  rule: Approval gates block exact consequential transitions, not authorized reversible
    preparation.
- id: G012
  rule: Broad implementation intent never implies approval for publish/deploy/charge/store-submit
    or equivalent gated transitions.
- id: G013
  rule: Project authorities/workspace/runtime evidence outrank chat memory and stale
    skill memory.
- id: G014
  rule: Source access/analysis, retention/VCS, target-product inclusion and redistribution
    are separate decisions; technical visibility grants no extra authority.
- id: G015
  rule: Claim strength must not exceed the strongest evidence boundary actually proven.
- id: G016
  rule: Parseability, name occurrence or plausibility do not establish object identity;
    ambiguous resolution fails closed to UNRESOLVED.
- id: G017
  rule: Partial value correctness does not imply population completeness; independent
    corroboration requires materially independent failure modes.
- id: G018
  rule: Derived reference views remain traceable/reproducible from authoritative evidence
    and current contradictory views must be reconciled or explicitly superseded.
- id: G019
  rule: Runtime-sensitive reference claims must not be presented as runtime-verified
    or complete solely from static/package evidence when a representative authorized
    real-boundary attempt is practical and material; unavailable runtime remains explicit.
